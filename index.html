<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>森林小熊五子棋</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sky"></div>
  <main class="app">
    <header class="topbar">
      <img class="bear bear-left" src="assets/bear-left.svg" alt="森林小熊装饰">
      <h1 id="gameTitle">森林小熊五子棋</h1>
      <p class="subtitle">双人对战 / 人机挑战</p>
      <img class="bear bear-right" src="assets/bear-right.svg" alt="森林小熊装饰">
    </header>

    <section class="panel">
      <div class="controls">
        <label for="gameTypeSelect">棋种</label>
        <select id="gameTypeSelect">
          <option value="tictactoe">三子棋</option>
          <option value="connect4">四子棋</option>
          <option value="gomoku" selected>五子棋</option>
          <option value="connect6">六子棋</option>
        </select>

        <label for="modeSelect">模式</label>
        <select id="modeSelect">
          <option value="pvp">双人对战</option>
          <option value="pve" selected>人机对战</option>
        </select>

        <label for="difficultySelect">难度</label>
        <select id="difficultySelect">
          <option value="easy">简单</option>
          <option value="normal" selected>普通</option>
          <option value="hard">困难</option>
        </select>

        <button id="undoBtn" type="button">悔棋</button>

        <button id="resetBtn" type="button">重新开始</button>

        <label class="sound-toggle" for="soundToggle">
          <input id="soundToggle" type="checkbox">
          音效
        </label>

        <label class="sound-toggle" for="bgmToggle">
          <input id="bgmToggle" type="checkbox">
          背景音乐
        </label>

        <label for="bgmStyleSelect">音乐风格</label>
        <select id="bgmStyleSelect">
          <option value="happy" selected>欢快</option>
          <option value="calm">安静</option>
          <option value="tense">紧张</option>
          <option value="eerie">诡异</option>
          <option value="horror">恐怖</option>
        </select>

        <div class="sound-toggle volume-control">
          <button id="muteBtn" type="button" class="mute-btn" aria-label="静音">🔊</button>
          <label for="bgmVolume">音量</label>
          <input id="bgmVolume" type="range" min="0" max="100" value="36" step="1">
        </div>
      </div>

      <div class="status-wrap">
        <span class="status-dot" id="turnDot"></span>
        <p id="statusText">黑棋先手，开始吧！</p>
      </div>
    </section>

    <section class="board-wrap">
      <canvas id="boardCanvas" width="620" height="620" aria-label="五子棋棋盘"></canvas>

      <div id="celebration" class="celebration hidden" aria-hidden="true">
        <div class="confetti-layer" id="confettiLayer"></div>
        <div class="winner-banner" id="winnerBanner">胜利！</div>
      </div>
    </section>

    <section class="tips">
      <h2>小提示</h2>
      <ul>
        <li>黑棋先手，连成五个同色棋子即可获胜。</li>
        <li>六子棋：黑棋第一手下 1 子，之后每方每回合各下 2 子，先连成 6 子获胜。</li>
        <li>四子棋：点击某一列落子，棋子会因重力落到底部，先连成 4 子获胜。</li>
        <li>三子棋：3×3 棋盘，点击空格落子，先连成 3 子获胜。</li>
        <li>人机模式下你执黑棋，电脑执白棋。</li>
        <li>悔棋：双人撤回 1 步；人机模式会回退到你落子前。</li>
        <li>可单独开关音效与背景音乐，还能调整音乐风格和音量。</li>
        <li>这是原创森林风格，适合小朋友游玩。</li>
      </ul>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
