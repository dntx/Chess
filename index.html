<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>森林小熊五子棋</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sky"></div>
  <main class="app">
    <header class="topbar">
      <h1>森林小熊五子棋</h1>
      <p class="subtitle">双人对战 / 人机挑战</p>
    </header>

    <section class="panel">
      <div class="controls">
        <label for="modeSelect">模式</label>
        <select id="modeSelect">
          <option value="pvp">双人对战</option>
          <option value="pve">人机对战</option>
        </select>

        <button id="resetBtn" type="button">重新开始</button>
      </div>

      <div class="status-wrap">
        <span class="status-dot" id="turnDot"></span>
        <p id="statusText">黑棋先手，开始吧！</p>
      </div>
    </section>

    <section class="board-wrap">
      <canvas id="boardCanvas" width="620" height="620" aria-label="五子棋棋盘"></canvas>
    </section>

    <section class="tips">
      <h2>小提示</h2>
      <ul>
        <li>黑棋先手，连成五个同色棋子即可获胜。</li>
        <li>人机模式下你执黑棋，电脑执白棋。</li>
        <li>这是原创森林风格，适合小朋友游玩。</li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
